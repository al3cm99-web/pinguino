<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Una lettera per te 💌</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


    <main class="scene">


        <!-- =========================
             VIDEO DEL PINGUINO
        ========================== -->

        <video
            id="penguinVideo"
            autoplay
            muted
            playsinline
            preload="auto"
        >

            <source
                src="pinguino.mp4"
                type="video/mp4"
            >

        </video>



        <!-- =========================
             PULSANTE APRI LETTERA
        ========================== -->

        <button id="openLetter">

            💌 Apri la lettera

        </button>



        <!-- =========================
             SCHERMATA LETTERA
        ========================== -->

        <div id="letterScreen">

            <img
                src="lettera.png"
                alt="Lettera"
                id="letterImage"
            >

        </div>


    </main>



    <script src="script.js"></script>


</body>

</html>
